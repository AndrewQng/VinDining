<!doctype html>
<html lang="vi" data-theme="dark" data-area="guest">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VinDining</title>
    <script>
      (function () {
        var p = (window.location && window.location.pathname) || '/';
        var isStaff = /^\/(dang-nhap|login|kds|phuc-vu|pos|dieu-phoi|expediter|thu-ngan|cashier|quan-ly|manager|dev\/ui)(\/|$)/i.test(p);
        document.documentElement.setAttribute('data-area', isStaff ? 'staff' : 'guest');
        try {
          var saved = localStorage.getItem('vd-theme');
          var theme = saved === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
